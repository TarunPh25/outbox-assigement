services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: reachinbox, POSTGRES_PASSWORD: reachinbox, POSTGRES_DB: reachinbox }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]   # AOF: delayed jobs survive Redis restarts
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
  # Local fake SMTP for development when Ethereal is unreachable. UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit
    environment: { MP_SMTP_AUTH_ACCEPT_ANY: "1", MP_SMTP_AUTH_ALLOW_INSECURE: "1" }
    ports: ["1025:1025", "8025:8025"]
volumes: { pgdata: {}, redisdata: {}, esdata: {} }
